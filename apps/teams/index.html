<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Repartidor de equipos</title>
<meta name="description" content="Pega una lista de personas y repártelas en equipos equilibrados: capitanes fijos, parejas que no deben coincidir y reparto instantáneo.">
<meta name="theme-color" content="#ee1515">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;900&display=swap">
<link rel="stylesheet" href="../../assets/shared/base.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body data-theme="pokemon">

<header class="topbar">
  <a class="back" href="../../index.html" title="Volver a MiniApps">&#8592;</a>
  <h1 class="logo"><span class="logo-ball" aria-hidden="true"></span> Equipos</h1>
  <a class="donate" href="https://github.com/cpinan/MiniApps/blob/main/DONATE_ES.md"
     target="_blank" rel="noopener" title="Apoyar MiniApps · gratis y sin anuncios"
     aria-label="Donar"><span class="cup" aria-hidden="true">☕</span><span class="donate-text">Donar</span></a>
  <button id="themeBtn" class="ghost" type="button" title="Cambiar tema">Tema</button>
</header>

<main class="layout">

  <section class="panel" aria-label="Configuración">

    <details class="block" open>
      <summary>1 · Personas <span id="countBadge" class="badge">0</span></summary>
      <textarea id="namesInput" rows="6" spellcheck="false"
        placeholder="Pega los nombres.&#10;Coma, punto y coma, tab, salto de línea o CSV.&#10;&#10;Ash, Misty, Brock&#10;Gary&#10;Serena;Clemont"></textarea>
      <div class="row">
        <button id="demoBtn" class="ghost" type="button">Demo</button>
        <button id="clearBtn" class="ghost danger" type="button">Vaciar</button>
      </div>
      <label class="check"><input type="checkbox" id="dedupe" checked> Quitar nombres repetidos</label>
    </details>

    <details class="block" open>
      <summary>2 · Reparto</summary>
      <label class="field">
        <span>Repartir por…</span>
        <select id="mode">
          <option value="teams">número de equipos</option>
          <option value="size">personas por equipo</option>
        </select>
      </label>
      <label class="field">
        <span id="amountLabel">Cuántos equipos</span>
        <input type="number" id="amount" min="2" max="50" value="2">
      </label>
      <label class="check"><input type="checkbox" id="balance" checked>
        Repartir el sobrante uno a uno (equipos lo más parejos posible)</label>
      <label class="check"><input type="checkbox" id="sound" checked> Sonido</label>
    </details>

    <details class="block">
      <summary>3 · Restricciones</summary>
      <label class="field">
        <span>Capitanes (uno por equipo, no coinciden)</span>
        <textarea id="captainsInput" rows="2" spellcheck="false"
          placeholder="Ash, Gary"></textarea>
      </label>
      <label class="field">
        <span>No juntar (una pareja por línea)</span>
        <textarea id="apartInput" rows="2" spellcheck="false"
          placeholder="Ash, Gary&#10;Misty, Serena"></textarea>
      </label>
      <p class="hint">Si una restricción es imposible, se avisa y se reparte igual sin ella.</p>
    </details>

    <details class="block">
      <summary>4 · Resultado</summary>
      <div class="row">
        <button id="copyBtn" class="ghost" type="button">Copiar</button>
        <button id="shareBtn" class="ghost" type="button">Copiar link</button>
      </div>
      <p class="hint">El link lleva la lista y la configuración; no se guarda nada en ningún servidor.</p>
    </details>

    <details class="block">
      <summary>5 · Apariencia</summary>
      <label class="field">
        <span>Tema</span>
        <select id="theme">
          <option value="pokemon">Pokémon</option>
          <option value="pokemmo">PokeMMO</option>
          <option value="neon">Neón</option>
          <option value="pastel">Pastel</option>
          <option value="mono">Mono</option>
          <option value="custom">Personalizado…</option>
        </select>
      </label>
      <div id="customColors" class="colors" hidden>
        <label class="swatch"><input type="color" id="col1" value="#ee1515"><span>Color A</span></label>
        <label class="swatch"><input type="color" id="col2" value="#3b4cca"><span>Color B</span></label>
        <label class="swatch"><input type="color" id="col3" value="#ffcb05"><span>Detalle</span></label>
        <button id="randomColors" class="ghost" type="button">Al azar</button>
      </div>
    </details>

    <p class="hint" id="statusLine">Pega una lista y reparte.</p>
    <div class="footer-row">
      <span class="hint build" id="buildTag"></span>
      <button id="repairBtn" class="ghost tiny" type="button"
        title="Borra la caché y el service worker, y recarga la última versión">Reparar app</button>
    </div>
  </section>

  <section class="stage" aria-label="Equipos">
    <button id="splitBtn" class="split primary" type="button">Repartir</button>
    <p class="summary" id="summaryLine">Sin reparto todavía.</p>
    <div id="teams" class="teams" aria-live="polite"></div>
  </section>
</main>

<canvas id="fx" class="fx" aria-hidden="true"></canvas>
<script type="module" src="./app.js"></script>
</body>
</html>
